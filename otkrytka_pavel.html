<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>С Днём Рождения, Павел!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0b1230;
    --dusk:#1b2158;
    --plum:#4a3467;
    --peach:#f4c7b3;
    --gold:#f2d48a;
    --gold-deep:#c99a45;
    --cream:#fbf3ea;
    --serif:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
    --sans:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;}
  body{
    font-family:var(--sans);
    color:var(--cream);
    background:var(--night);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Небо: закат над городом, как на фото ---------- */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(90% 55% at 50% 108%, rgba(244,168,140,.78) 0%, rgba(244,168,140,0) 70%),
      radial-gradient(70% 50% at 85% 4%, rgba(88,110,200,.45) 0%, rgba(88,110,200,0) 70%),
      linear-gradient(180deg,#0b1230 0%,#1b2158 48%,#4a3467 82%,#8c4f6a 100%);
  }
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:#fff;opacity:.15;
    animation:twinkle var(--t,4s) ease-in-out infinite;animation-delay:var(--d,0s);
  }
  @keyframes twinkle{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.9;transform:scale(1.4)}}

  /* ---------- Шары ---------- */
  .balloons{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .balloon{
    position:absolute;left:var(--x);bottom:-160px;width:var(--w);
    opacity:0;
  }
  .open .balloon{animation:rise var(--dur) linear infinite;animation-delay:var(--delay)}
  .balloon .sway{animation:sway 5s ease-in-out infinite alternate;animation-delay:var(--delay);transform-origin:50% 100%}
  .balloon svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
  @keyframes rise{
    0%{transform:translateY(0);opacity:0}
    6%{opacity:.62}
    92%{opacity:.62}
    100%{transform:translateY(-135vh);opacity:0}
  }
  @keyframes sway{from{transform:translateX(-14px) rotate(-4deg)}to{transform:translateX(14px) rotate(4deg)}}

  /* ---------- Салют ---------- */
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}

  /* ---------- Вступление: подарок ---------- */
  #intro{
    position:fixed;inset:0;z-index:10;
    display:grid;place-items:center;text-align:center;
    padding:24px;
    transition:opacity .6s ease, transform .6s ease;
  }
  #intro.gone{opacity:0;transform:scale(1.06);pointer-events:none}
  .intro-inner{display:grid;justify-items:center;gap:14px;max-width:420px}
  .gift{width:clamp(150px,44vw,210px);height:auto;overflow:visible;filter:drop-shadow(0 22px 34px rgba(0,0,0,.4));animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .gift .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .65s cubic-bezier(.5,-.4,.6,1),opacity .65s ease}
  .opening .gift .lid{transform:translateY(-120px) rotate(-16deg);opacity:0}
  .gift .glow{opacity:0;transition:opacity .4s ease .1s}
  .opening .gift .glow{opacity:1}
  .intro-title{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;color:var(--gold)}
  .intro-sub{font-size:1rem;line-height:1.5;color:rgba(251,243,234,.82)}
  .btn{
    position:relative;font:500 1rem/1 var(--sans);
    padding:16px 34px;border:0;border-radius:999px;cursor:pointer;
    color:#2a1b12;
    background:linear-gradient(135deg,#f9e6ad,#e6bd66 55%,#f2d48a);
    box-shadow:0 10px 30px rgba(230,189,102,.35),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(230,189,102,.5),inset 0 1px 0 rgba(255,255,255,.6)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
  .btn.pulse::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    box-shadow:0 0 0 0 rgba(242,212,138,.6);animation:ping 2.2s ease-out infinite;
  }
  @keyframes ping{to{box-shadow:0 0 0 22px rgba(242,212,138,0)}}

  /* ---------- Открытка ---------- */
  #card{
    position:relative;z-index:3;visibility:hidden;
    min-height:100vh;min-height:100svh;
    display:grid;place-items:center;
    padding:clamp(24px,5vw,56px) clamp(18px,4vw,48px);
    padding-top:max(clamp(24px,5vw,56px),env(safe-area-inset-top,0px));
    padding-bottom:max(clamp(24px,5vw,56px),env(safe-area-inset-bottom,0px));
  }
  .open #card{visibility:visible}
  .wrap{
    width:100%;max-width:1080px;
    display:grid;grid-template-columns:1fr;
    gap:clamp(28px,5vw,64px);align-items:center;
  }
  @media (min-width:860px){
    .wrap{grid-template-columns:minmax(300px,410px) 1fr}
  }

  /* Фото в арке */
  .frame{position:relative;justify-self:center;width:min(76vw,380px)}
  @media (min-width:860px){.frame{width:100%;justify-self:start}}
  .arch{
    position:relative;aspect-ratio:3/4;overflow:hidden;
    border-radius:50% 50% 26px 26px / 37.5% 37.5% 26px 26px;
    box-shadow:
      0 0 0 4px rgba(242,212,138,.95),
      0 0 0 11px rgba(242,212,138,.16),
      0 34px 80px rgba(0,0,0,.5);
    opacity:0;
  }
  .open .arch{animation:arch-in 1.3s cubic-bezier(.2,.8,.2,1) .15s forwards}
  @keyframes arch-in{
    from{opacity:0;transform:translateY(46px) scale(.93)}
    to{opacity:1;transform:none}
  }
  .arch img{
    display:block;width:100%;height:100%;object-fit:cover;object-position:50% 40%;
    transform-origin:55% 35%;
    animation:drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09)}}
  .arch::after{ /* тёплый блик заката */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(200deg,rgba(255,220,170,.22),rgba(255,220,170,0) 45%);
  }
  .spark{
    position:absolute;width:var(--s,22px);height:var(--s,22px);color:var(--gold);
    opacity:0;pointer-events:none;
  }
  .open .spark{animation:spark 3.2s ease-in-out infinite;animation-delay:calc(1.4s + var(--d,0s))}
  @keyframes spark{
    0%,100%{opacity:0;transform:scale(.3) rotate(0)}
    50%{opacity:1;transform:scale(1) rotate(45deg)}
  }

  /* Текст */
  .text{display:grid;gap:clamp(20px,3vw,30px);text-align:center}
  @media (min-width:860px){.text{text-align:left}}

  h1{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(2.35rem,7.6vw,3.9rem);line-height:1.04;letter-spacing:.005em;
    color:var(--gold);
    text-shadow:0 2px 34px rgba(244,168,140,.3);
  }
  h1 .line{display:block}
  .word{display:inline-block;white-space:nowrap}
  .ch{display:inline-block;opacity:0;transform:translateY(.55em) rotate(5deg)}
  .open .ch{
    animation:letter .85s cubic-bezier(.2,.8,.2,1) forwards, glint 5s ease-in-out infinite;
    animation-delay:calc(.55s + var(--i) * .05s), calc(3s + var(--i) * .08s);
  }
  @keyframes letter{to{opacity:1;transform:none}}
  @keyframes glint{
    0%,20%,100%{color:var(--gold);text-shadow:none}
    9%{color:#fffaf0;text-shadow:0 0 20px rgba(255,236,180,.95)}
  }

  .note{
    display:grid;gap:16px;
    padding:clamp(22px,4vw,40px);
    border:1px solid rgba(242,212,138,.3);
    border-radius:28px;
    background:rgba(255,255,255,.055);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:0 24px 60px rgba(5,8,25,.35);
  }
  .note p{font-size:clamp(1.02rem,2.2vw,1.16rem);line-height:1.68;color:rgba(251,243,234,.95);max-width:52ch}
  .note p.thanks{
    font-family:var(--serif);font-style:italic;font-weight:600;
    font-size:clamp(1.5rem,3.8vw,2rem);line-height:1.25;color:var(--gold);
    margin-top:6px;
  }
  .note .btn{justify-self:center;margin-top:8px}
  @media (min-width:860px){.note .btn{justify-self:start}}

  .fade{opacity:0;transform:translateY(16px)}
  .open .fade{animation:fade-in .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
  @keyframes fade-in{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .balloon,.star,.gift,.btn.pulse::after,.arch img,.spark{animation:none!important}
    .ch,.fade,.arch{opacity:1!important;transform:none!important;animation:none!important}
    .balloons{display:none}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="balloons" id="balloons" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- Вступление -->
<section id="intro" aria-label="Открыть открытку">

        <linearGradient id="gBox" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6c2b1"/><stop offset="1" stop-color="#e48f8a"/>
        </linearGradient>
        <linearGradient id="gRib" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fbe9b4"/><stop offset="1" stop-color="#d9a94d"/>
        </linearGradient>
        <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff2c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
        </radialGradient>

      <circle class="glow" cx="80" cy="70" r="70" fill="url(#gGlow)"/>
      <rect x="26" y="78" width="108" height="78" rx="8" fill="url(#gBox)"/>
      <rect x="72" y="78" width="16" height="78" fill="url(#gRib)"/>
      <g class="lid">
        <rect x="18" y="56" width="124" height="28" rx="8" fill="#f8cfc0"/>
        <rect x="72" y="56" width="16" height="28" fill="url(#gRib)"/>
        <path d="M80 56 C58 14, 24 26, 46 50 C58 60, 74 57, 80 56Z" fill="url(#gRib)"/>
        <path d="M80 56 C102 14, 136 26, 114 50 C102 60, 86 57, 80 56Z" fill="url(#gRib)"/>
        <circle cx="80" cy="56" r="8" fill="#d9a94d"/>
      </g>
    </svg>
    <h2 class="intro-title">Для Павла</h2>
    <p class="intro-sub">Здесь спрятано праздничное поздравление</p>
    <button class="btn pulse" id="open" type="button">Открыть открытку</button>
  </div>
</section>

    st.style.left = rand(0,100)+'%'; st.style.top = rand(0,70)+'%';
    st.style.setProperty('--t', rand(3,6.5).toFixed(2)+'s');
    st.style.setProperty('--d', rand(0,6).toFixed(2)+'s');
    var sz = rand(1.5,3.5); st.style.width = st.style.height = sz+'px';
    starsEl.appendChild(st);
  }

  /* ---------- Шары ---------- */
  var balloonColors = ['#f4b9a4','#f2d48a','#9dbdf2','#e79aa6','#fbf3ea','#c7b5ee'];
  var bEl = document.getElementById('balloons');
  for (var b=0;b<7;b++){
    var col = balloonColors[b % balloonColors.length];
    var el = document.createElement('div'); el.className='balloon';
    el.style.setProperty('--x', (4 + b*14 + rand(-3,3)).toFixed(1)+'%');
    el.style.setProperty('--w', rand(46,78).toFixed(0)+'px');
    el.style.setProperty('--dur', rand(17,27).toFixed(1)+'s');
    el.style.setProperty('--delay', (b*1.9 + rand(0,2)).toFixed(1)+'s');
    el.innerHTML =
      '<div class="sway"><svg viewBox="0 0 60 110">'+
      '<path d="M30 68 q-9 14 0 24 q8 10 0 18" stroke="rgba(255,255,255,.55)" stroke-width="1.2" fill="none"/>'+
      '<path d="M30 63 l-5.5 8 h11z" fill="'+col+'"/>'+
      '<ellipse cx="30" cy="34" rx="25" ry="31" fill="'+col+'"/>'+
      '<ellipse cx="20" cy="21" rx="6" ry="11" fill="rgba(255,255,255,.4)" transform="rotate(22 20 21)"/>'+
      '</svg></div>';
    bEl.appendChild(el);
  }

  /* ---------- Салют и конфетти ---------- */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  var W=0,H=0,dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize); resize();

  var palette = ['#f2d48a','#ffe9a8','#f4b9a4','#ffd1c1','#9dbdf2','#ffffff','#e79aa6'];
  var rockets=[], sparks=[], confetti=[];

  function launch(tx,ty){
    var sx = tx + rand(-130,130);
    rockets.push({sx:sx,sy:H+10,tx:tx,ty:ty,x:sx,y:H+10,t:0,dur:rand(650,950)});
  }
  function explode(x,y){
    var c1 = pick(palette), c2 = pick(palette);
    var n = Math.floor(rand(80,120)), ring = Math.random() < .35;
    for (var i=0;i<n;i++){
      var a = Math.PI*2*i/n + (ring?0:rand(-.2,.2));
      var s = ring ? 4.2 : rand(1,5.6);
      sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rand(.009,.018),c:(i%2?c1:c2),r:rand(1.3,2.5)});
    }
    if (sparks.length > 1600) sparks.splice(0, sparks.length-1600);
  }
  var confettiColors = ['#f2d48a','#f4b9a4','#9dbdf2','#e79aa6','#fbf3ea','#c99a45'];
  function cannon(){
    for (var side=0; side<2; side++){
      for (var i=0;i<55;i++){
        var a = rand(-1.35,-.75); if (side) a = Math.PI - a;
        var s = rand(9,17);
        confetti.push({
          x: side? W : 0, y: H,
          vx: Math.cos(a)*s, vy: Math.sin(a)*s,
          w: rand(6,11), h: rand(4,7), rot: rand(0,6.28), vr: rand(-.25,.25),
          flip: rand(0,6.28), c: pick(confettiColors)
        });
      }
    }
    if (confetti.length > 500) confetti.splice(0, confetti.length-500);
  }

  var last = performance.now();
  function frame(now){
    var dt = Math.min(now-last, 50); last = now;
    var k = dt/16.667;
    ctx.clearRect(0,0,W,H);

    /* ракеты */
    for (var r=rockets.length-1;r>=0;r--){
      var ro = rockets[r]; ro.t += dt;
      var p = Math.min(ro.t/ro.dur,1), e = 1-Math.pow(1-p,2);
      ro.x = ro.sx + (ro.tx-ro.sx)*e; ro.y = ro.sy + (ro.ty-ro.sy)*e;
      sparks.push({x:ro.x,y:ro.y,vx:rand(-.3,.3),vy:rand(.2,.8),life:.7,decay:.05,c:'#ffe9a8',r:1.6});
      if (p >= 1){ explode(ro.tx,ro.ty); rockets.splice(r,1); }
    }

    /* искры */
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    var drag = Math.pow(.985,k);
    for (var s=sparks.length-1;s>=0;s--){
      var sp = sparks[s];
      sp.vx *= drag; sp.vy = sp.vy*drag + .045*k;
      sp.x += sp.vx*k; sp.y += sp.vy*k; sp.life -= sp.decay*k;
      if (sp.life <= 0){ sparks.splice(s,1); continue; }
      ctx.globalAlpha = Math.max(sp.life,0);
      ctx.strokeStyle = sp.c; ctx.lineWidth = sp.r;
      ctx.beginPath(); ctx.moveTo(sp.x-sp.vx*1.6, sp.y-sp.vy*1.6); ctx.lineTo(sp.x, sp.y); ctx.stroke();
    }

    /* конфетти */
    ctx.globalCompositeOperation = 'source-over';
    var cd = Math.pow(.965,k);
    for (var q=confetti.length-1;q>=0;q--){
      var f = confetti[q];
      f.vx *= cd; f.vy = f.vy*cd + .2*k;
      f.x += f.vx*k + Math.sin(f.flip)*.6*k; f.y += f.vy*k;
      f.rot += f.vr*k; f.flip += .15*k;
      if (f.y > H+30){ confetti.splice(q,1); continue; }
      ctx.save(); ctx.globalAlpha = 1; ctx.translate(f.x,f.y); ctx.rotate(f.rot);
      ctx.scale(1, Math.cos(f.flip)); ctx.fillStyle = f.c;
      ctx.fillRect(-f.w/2,-f.h/2,f.w,f.h); ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Открытие ---------- */
  var opened = false, autoTimer = null;
  var intro = document.getElementById('intro');
  var openBtn = document.getElementById('open');

  function start(){
    opened = true;
    document.body.classList.add('open');
    cannon();
    [250,900,1600].forEach(function(t,i){
      setTimeout(function(){ launch(W*[.22,.78,.5][i], H*rand(.15,.35)); }, t);
    });
    if (!reduce){
      autoTimer = setInterval(function(){
        if (document.hidden) return;
        launch(rand(.12,.88)*W, rand(.1,.38)*H);
      }, 4200);
    }
  }
  openBtn.addEventListener('click', function(){
    openBtn.disabled = true;
    intro.classList.add('opening');
    setTimeout(function(){
      intro.classList.add('gone');
      start();
    }, 700);
    setTimeout(function(){ intro.remove(); }, 1500);
  });

  /* ---------- Ещё салют ---------- */
  document.getElementById('more').addEventListener('click', function(){
    cannon();
    for (var i=0;i<4;i++){
      (function(i){ setTimeout(function(){ launch(rand(.12,.88)*W, rand(.1,.4)*H); }, i*280); })(i);
    }
  });
  document.addEventListener('pointerdown', function(e){
    if (!opened || (e.target.closest && e.target.closest('button'))) return;
    launch(e.clientX, e.clientY);
  });
})();
</script>
</body>
</html>
